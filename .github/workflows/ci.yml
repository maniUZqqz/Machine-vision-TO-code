name: ci

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

jobs:
  quick:
    # Fast tests only: no browser, no benchmark.  Tesseract is installed so the OCR smoke test runs.
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-fas tesseract-ocr-eng
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ocr-tesseract,web,dev]"
      - name: Unit + end-to-end tests (CLI, Django API)
        run: python -m pytest tests -q -m "not browser"

  browser:
    # Golden pages + feedback loop + responsive checks in a real headless browser (slower, manual / nightly).
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-fas tesseract-ocr-eng
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[ocr-tesseract,web,browser,bench,dev]"
          python -m playwright install --with-deps chromium
      - run: python -m pytest tests -q
      - run: python -m bench run --quick --out bench/results-ci.json
      - uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: bench/results-ci.json

